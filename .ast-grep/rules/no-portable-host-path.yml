id: no-portable-host-path
language: Rust
severity: error
message: Host filesystem paths are only allowed in native, host, test, and tool adapters.
note: |
  Lower the value to FileKey, DirKey, RelativePath, or a typed external locator at the adapter
  boundary. Add a narrow ignore only when the file is itself an OS adapter.

rule:
  any:
    - kind: scoped_identifier
      regex: '^std::(path|fs)(::|$)'
    - kind: type_identifier
      regex: '^PathBuf$'

ignores:
  - '**/target/**'
  - '**/build.rs'
  - '**/tests/**/*.rs'
  - '**/benches/**/*.rs'
  - '**/examples/**/*.rs'
  - 'jals-storage/src/native.rs'
  - 'jals-classpath/src/native.rs'
  - 'jals-project/src/native.rs'
  - 'jals-build/src/native.rs'
  - 'jals-build/src/manifest_ext.rs'
  - 'jals-build/src/request.rs'
  - 'jals-build/src/invocation.rs'
  - 'jals-build/src/toolchain.rs'
  - 'jals-build/src/builtin.rs'
  # Writes a frontend's lowered tree to disk so `javac` can read it — the one place cache keys
  # become host paths. `native`-gated; the `Backend` trait it feeds stays portable.
  - 'jals-build/src/staging.rs'
  # The `javac` adapter: the only `Backend` implementation that needs a host process, so it is where
  # the portable request meets host paths (the staged sources, the classpath, the project root).
  # `native`-gated; the seam it implements stays ungated and `wasm32`-buildable.
  - 'jals-build/src/javac_backend.rs'
  - 'jals-cli/src/**/*.rs'
  - 'jals-lsp/src/**/*.rs'
  - 'jals-tests/src/**/*.rs'
  - 'xtask/src/**/*.rs'
  - 'editors/zed/src/**/*.rs'
