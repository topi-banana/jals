# Configuration for `typos` (https://github.com/crate-ci/typos).

[files]
# `jals-tests/sources/` holds vendored upstream code (the openjdk submodule)
# used only as parser test fixtures; don't spell-check third-party code.
extend-exclude = ["jals-tests/sources/"]

[default.extend-words]
# Unicode general category short names appear in lexer regexes (e.g. \p{Nd});
# they are not typos of English words such as "And".
Nd = "Nd"
# `fo` is a placeholder for a partially-typed member name in completion docs
# (e.g. `receiver.fo`), not a misspelling of "for"/"of".
fo = "fo"
# `nam` is a deliberately misspelled field name in a `deny_unknown_fields` test
# (jals-config `Distribution`), asserting the typo is rejected; not our typo.
nam = "nam"
# `ifle` is the JVM bytecode opcode "if less than or equal" (JVMS §6),
# modelled as the `Ifle` instruction variant; not a misspelling of "file".
ifle = "ifle"
Ifle = "Ifle"
# `mis` is the hyphenated prefix in prose like `mis-read` / `mis-structured` /
# `mis-associating` (jals-decompile docs); not a misspelling of "miss"/"mist".
mis = "mis"
# The three identifiers below are misspelled *in the vendors' products*, and
# `jals-fmt`'s importer models reproduce them verbatim — a corrected spelling
# would silently stop matching the real setting.
#   Eclipse JDT: `org.eclipse.jdt.core.formatter.parentheses_positions_in_for_statment`
#                `...formatter.parentheses_positions_in_method_delcaration`
#                `...formatter.keep_imple_if_on_one_line`
statment = "statment"
delcaration = "delcaration"
imple = "imple"
#   IntelliJ: `SPACE_BEFORE_ANOTATION_PARAMETER_LIST` (one `n`) and
#             `JD_ADD_BLANK_AFTER_PARM_COMMENTS` (`PARM`, not `PARAM`).
anotation = "anotation"
Anotation = "Anotation"
parm = "parm"
PARM = "PARM"
