[package]
name = "hello_world_wasm"
version = "0.1.0"

# `jals-wasm` compiles every source in the project into ONE WebAssembly module
# — wasm has no dynamic loading and no classpath, so there is nothing for a
# per-type artifact to be loaded by. There is no `[run] main-class` here and
# there cannot be one: `main` takes a `String[]`, and a wasm host has no
# `java.base` to supply `String`. The entry point is an exported method, named
# on the command line with `jals run --invoke <name>`.
[build]
backend = { type = "jals-wasm" }
source-dirs = ["src/main/java"]  # .java source roots
classes-dir = "target/classes"   # where project.wasm lands (also what `jals clean` removes)
