"1.16" = ["since-1.16", "minecraft/1.16"]
"1.15.2" = ["since-1.15", "minecraft/1.15.2"]
"1.15.1" = ["since-1.15", "minecraft/1.15.1"]
"1.15" = ["since-1.15", "minecraft/1.15"]
"1.14.4" = ["since-1.14.4", "minecraft/1.14.4"]

[dependencies]
# The same SDK a consumer depends on, with its default features — and, because a `path` dependency's
# node identity is its canonicalized directory, the *same node*. The features every edge routes to
# it are unioned there, so `minecraft/1.20.1` written here and written by the consumer are one
# selection and one remap, not two.
#
# The defaults are left alone deliberately. `default-features = false` would spare a standalone
# build here the server download, but the SDK's `mixin` and `mixinextras` publications write into
# its *own* `src/main/java`, and a root a selection stops publishing does not stop existing: the
# next build captures the previous run's tree as authored source and hands it to `javac`. Two
# projects sharing one SDK directory therefore have to agree about which roots are published, and
# agreeing on "the defaults" is the cheapest way to do that.
#
# `client` rides the edge rather than a feature of this project's own, because there is no selection
# here that wants a harness with no client jar to compile it against. The 43 release features name
# the *release*; which side of the game is not a question anyone asks this project.
minecraft = { path = "../minecraft", features = ["client"] }

[build]
script = { type = "rhai", file = "build.rhai" }
