[package]
name = "hellomod"
version = "0.1.0"
# The jals dialect's conditional compilation, and the only reason this project declares a package
# feature at all. `attributes` is what makes an `#[cfg(feature = "…")]` in `src/main/java` a
# directive rather than a syntax error: the compile frontend strips every attribute before `javac`
# sees the source, and blanks — length-preservingly, so a line number in a stack trace still names
# the line the author wrote — every declaration or statement whose predicate is false.
features = ["attributes"]

# Two kinds of name live here, and only the first is ever selected on a command line.
#
# A **version feature** (`1.20.1`) is one Minecraft release. It routes its own name into the SDK and
# enables the highest *threshold* feature that release satisfies. The `minecraft/…` entry is
# routing only and is never queryable in this project; declaring the name locally is also what lets
# the `[[mappings.mojmap]]` alternatives below gate on it.
#
# A **threshold feature** (`since-1.18`) is what everything else reads: the `#[cfg]` predicates in
# the source, the compatibility level `mixins.hellomod.json` renders, and the `--release` derived in
# `build.rhai`. Each one enables its predecessor, so naming the highest enables the whole chain
# below it — `#[cfg(feature = "since-1.18")]` is true for every release from 1.18 up, and no
# release has to list more than one name.
#
# A threshold exists only where something branches on it, which is why there are five rather than
# forty-three. Three are the steps the game's own JVM took, the era table in `README.md`: 1.17 needs
# Java 16, 1.18 needs 17, 1.20.5 needs 21. The fourth is the single API rename this mod's source has
# to survive — at 1.21.6 `WorldVersion`'s getters became record-style accessors, so `getName()` is
# `name()`. Adding a threshold means adding a link to the chain and pointing the affected releases
# at it, never editing the releases below it.
#
# The fifth, `since-1.14.4`, is the bottom of the chain and the one every release reaches: it is
# how a selection that named *no* release stays distinguishable from one that named the oldest.
# `build.rhai` is what branches on it, and it rejects the build rather than compiling something.
# That is a change this example did not need before it had `#[cfg]`: `[dependencies] minecraft`
# leaves `default-features` at its `true`, so with no version feature the SDK still resolves its own
# `default` and falls back to its newest release — but the thresholds here would all be off, and the
# source would take its oldest branch against the newest game. There is deliberately no `default`
# naming a version either, because `[features]` resolution is additive: a default version would
# survive `--features 1.20.1` and be a second release, which is exactly what the SDK rejects.
#
# The version features are mutually exclusive, and this project does not re-enforce that: the
# forwarded selection reaches the SDK's own build script, whose `build.error` rejects a second
# version before any download. Restating the rule here would be a second copy of a 43-row table.
[features]
server = ["minecraft/server"]
client = ["minecraft/client"]
mixin = ["minecraft/mixin"]
mixinextras = ["minecraft/mixinextras"]
"since-1.14.4" = []
"since-1.17" = ["since-1.14.4"]
"since-1.18" = ["since-1.17"]
"since-1.20.5" = ["since-1.18"]
"since-1.21.6" = ["since-1.20.5"]
"26.2" = ["since-1.21.6", "minecraft/26.2"]
"26.1.2" = ["since-1.21.6", "minecraft/26.1.2"]
"26.1.1" = ["since-1.21.6", "minecraft/26.1.1"]
"26.1" = ["since-1.21.6", "minecraft/26.1"]
"1.21.11" = ["since-1.21.6", "minecraft/1.21.11"]
"1.21.10" = ["since-1.21.6", "minecraft/1.21.10"]
"1.21.9" = ["since-1.21.6", "minecraft/1.21.9"]
"1.21.8" = ["since-1.21.6", "minecraft/1.21.8"]
"1.21.7" = ["since-1.21.6", "minecraft/1.21.7"]
"1.21.6" = ["since-1.21.6", "minecraft/1.21.6"]
"1.21.5" = ["since-1.20.5", "minecraft/1.21.5"]
