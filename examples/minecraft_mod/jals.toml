[package]
name = "hellomod"
version = "0.1.0"

# Every axis of the SDK, forwarded. A name declared here is a *local* build feature — which is what
# lets the `[[mappings.mojmap]]` alternatives below gate on it — whose list routes the same name into
# the dependency. Nothing here is queryable in this project: a `<dependency>/<feature>` entry is
# routing only.
#
# There is deliberately no `default`. `[dependencies] minecraft` leaves `default-features` at its
# `true`, so the SDK resolves its own `default = ["server", "mixin", "mixinextras"]` and its build
# script falls back to its own newest release. `jals build` with no flags therefore builds against
# 26.2 — which ships deobfuscated — and packages a jar with no reobfuscation pass at all.
#
# The version features are mutually exclusive, and this project does not re-enforce that: the
# forwarded selection reaches the SDK's own build script, whose `build.error` rejects a second
# version before any download. Restating the rule here would be a second copy of a 43-row table.
[features]
server = ["minecraft/server"]
client = ["minecraft/client"]
mixin = ["minecraft/mixin"]
mixinextras = ["minecraft/mixinextras"]
"26.2" = ["minecraft/26.2"]
"26.1.2" = ["minecraft/26.1.2"]
"26.1.1" = ["minecraft/26.1.1"]
"26.1" = ["minecraft/26.1"]
"1.21.11" = ["minecraft/1.21.11"]
"1.21.10" = ["minecraft/1.21.10"]
"1.21.9" = ["minecraft/1.21.9"]
"1.21.8" = ["minecraft/1.21.8"]
"1.21.7" = ["minecraft/1.21.7"]
"1.21.6" = ["minecraft/1.21.6"]
"1.21.5" = ["minecraft/1.21.5"]
"1.21.4" = ["minecraft/1.21.4"]
