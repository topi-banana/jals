"1.17.1" = ["since-1.17", "minecraft/1.17.1"]
"1.17" = ["since-1.17", "minecraft/1.17"]
"1.16.5" = ["since-1.14.4", "minecraft/1.16.5"]
"1.16.4" = ["since-1.14.4", "minecraft/1.16.4"]
"1.16.3" = ["since-1.14.4", "minecraft/1.16.3"]
"1.16.2" = ["since-1.14.4", "minecraft/1.16.2"]
"1.16.1" = ["since-1.14.4", "minecraft/1.16.1"]
"1.16" = ["since-1.14.4", "minecraft/1.16"]
"1.15.2" = ["since-1.14.4", "minecraft/1.15.2"]
"1.15.1" = ["since-1.14.4", "minecraft/1.15.1"]
"1.15" = ["since-1.14.4", "minecraft/1.15"]
"1.14.4" = ["since-1.14.4", "minecraft/1.14.4"]

# The SDK. Its build script puts the resolved game jar, `mixin-0.8.7.jar` and
# `mixinextras-common-0.5.4.jar` on this project's compile classpath, and publishes the matching
# sources as navigation trees an editor can open. Compiling against the jars and reading the trees
# is the whole arrangement; a published tree is never a compile input.
[dependencies]
minecraft = { path = "../minecraft" }

[build]
# Everything `javac` needs that varies with the release, derived from the threshold chain rather
# than from a second table of versions — see `build.rhai`.
script = { type = "rhai", file = "build.rhai" }
# The default value, written out because it is one of the two things this example demonstrates:
# `mixins.hellomod.json` has to be *in* the jar or Mixin has nothing to read.
resource-dirs = ["src/main/resources"]
# Reobfuscate the compiled classes and package them. `with` names one key; the key holds 39
# alternatives, one per release that ships obfuscated. At most one is ever active, because each
# names exactly one version feature and the 39 sets are pairwise incomparable — `jals` rejects a
# table where that could fail. The four 26.x releases name no alternative at all, so there the step
# packages the jar and rewrites nothing, which is exactly right: they ship deobfuscated.
remap = { with = "mojmap" }

# The one resource is rendered rather than copied, because one field of it is per-release: Mixin
# refuses a mixin class whose class-file version exceeds the declared `compatibilityLevel`, and
# `build.rhai` compiles at the release the game's own JVM asks for. Both read the same threshold
# chain, each in its own vocabulary — `--release 17` there, `JAVA_17` here.
#
# Naming the file is what turns rendering on. Everything else under a resource directory is still
# packaged byte for byte, which is the point: a resource is whatever the author put there, and a
# mod icon through a template engine is a corrupt PNG.
[build.resources]
template = ["mixins.hellomod.json"]

# One mapping set per obfuscated release, gated on that release's feature. Each URL is
# content-addressed by the same SHA-1 it is checked against, so one digest pins both the address and
# the bytes — the same property the SDK's version-metadata fetch relies on. `max-bytes` is the
# published size rounded up to the next MiB; the digest is what guarantees the content, so pinning
# the exact byte count would only break if Mojang ever re-served identical text with different
# framing.
#
# To refresh: for each catalog entry in `../minecraft/build.rhai` whose `obfuscated?` flag is true,
# fetch `https://piston-meta.mojang.com/v1/packages/<metadata sha1>/<version>.json` and project
# `downloads.server_mappings.{url, sha1, size}`.

[[mappings.mojmap]]
required-features = ["1.21.11"]
url = "https://piston-data.mojang.com/v1/objects/5621e9253f05fd57872bbe7f8ddf5f9a7d525955/server.txt"
sha1 = "5621e9253f05fd57872bbe7f8ddf5f9a7d525955"
max-bytes = 9437184

