"1.20.4" = ["since-1.18", "minecraft/1.20.4"]
"1.20.3" = ["since-1.18", "minecraft/1.20.3"]
"1.20.2" = ["since-1.18", "minecraft/1.20.2"]
"1.20.1" = ["since-1.18", "minecraft/1.20.1"]
"1.20" = ["since-1.18", "minecraft/1.20"]
"1.19.4" = ["since-1.18", "minecraft/1.19.4"]
