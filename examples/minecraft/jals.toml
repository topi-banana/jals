# No `[run]`, and no authored source at all: this project is something to *depend on*, and a source
# dependency's own files are compiled into whoever consumes it. A `Main` in the default package
# would therefore collide with the consumer's — everything worth having here is published by the
# build script into the three roots below `src/main/java`.
[build]
script = { type = "rhai", file = "build.rhai" }
