[package]
name = "minecraft"
version = "0.1.0"

# Four orthogonal axes: the distribution, the release, and the two optional libraries.
#
# `server`/`client` choose which Minecraft distribution the build script fetches and remaps.
# Enabling both produces the merged jar. Selection is additive, so `--features client` keeps the
# default `server` (and thus merges) unless `--no-default-features` is given.
#
# The release is chosen the same way, except the version features are mutually **exclusive**: at
# most one may be active, and the build script rejects every other combination. `default` therefore
# lists no version at all — the script falls back to the newest release — so `--features 1.20.1`
# selects a version without needing `--no-default-features` to drop a conflicting default. As a
# consequence `--all-features` selects every version at once and always fails.
#
# `mixin` touches no Minecraft artifact at all. It fetches *both* SpongePowered Mixin 0.8.7 jars —
# the classes onto the compile classpath, and the sources published as a second exclusively-owned
# root at `org/spongepowered/**` — independent of both axes above. Both halves are needed: a
# dependency's publications are navigation sources for a reader, so the classpath jar is what makes
# `org.spongepowered.asm.*` resolve for whoever depends on this project. It is on by default;
# `--no-default-features` drops it, and dropping the owner removes that published root again.
#
# `mixinextras` is that same shape once more, for MixinExtras 0.5.4 published as a third root at
# `com/llamalad7/**`. It is independent of `mixin` as well — neither feature implies the other, and
# each root appears and disappears on its own — so the two are simply both listed in `default`.
#
# The keys must be quoted: a bare `1.20.1` is a TOML dotted key, not a feature name. Both ends of
# the range are set by mappings: 1.14.4 is the oldest entry because Mojang published no official
# mappings before it, and from 26.1 the game ships deobfuscated with no mappings download at all —
# the build script simply skips its remap step there. Selecting such a release is no different from
# any other.
[features]
default = ["server", "mixin", "mixinextras"]
server = []
client = []
mixin = []
mixinextras = []
"26.2" = []
"26.1.2" = []
"26.1.1" = []
"26.1" = []
