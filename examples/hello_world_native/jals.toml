[package]
name = "hello_world_native"
version = "0.1.0"

# One WebAssembly module for the whole project, with the platform library linked into it.
#
# There is no `native-packages` line, and that is the point: `java.base` is not a package a project
# opts into, it is what `java.lang` *is* on this target. `[build] platform` names it and defaults to
# it, so a wasm project gets a `String` and a `System.out` by writing nothing — and a project that
# wants the smallest possible module says `platform = "none"` instead.
#
# `native-packages` is still there, for a *third-party* package: Java plus the Rust behind its
# `native` methods, which only this backend can take in because a class file has nowhere to put a
# host function.
[build]
backend = { type = "jals-wasm" }
source-dirs = ["src/main/java"]
classes-dir = "target/classes"   # where project.wasm lands (also what `jals clean` removes)
