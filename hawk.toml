# hawk.toml — declares the workspace's shipped binaries so `cargo hawk check`
# can run its closed-world visibility analysis. Each `[[production]]` entry is a
# reachability root: any `pub` item not reachable from one of these is a
# candidate for `hawk::dead_public` / `hawk::unnecessary_public`.
# See https://github.com/astral-sh/hawk for details.

[[production]]
package = "jals-cli"
bin = "jals"
reason = "primary shipped CLI: the Java formatter, LSP, and build front end"

[[production]]
package = "jals-playground"
bin = "jals-playground"
reason = "browser playground shipped as the wasm32 web frontend"

[[production]]
package = "jals-tests"
bin = "jals-tests"
reason = "corpus harness that parses real Java and reports parse-failure rates"

[[production]]
package = "jals-tests"
bin = "jals-golden"
reason = "golden harness comparing jals-fmt output against google-java-format"

[[production]]
package = "xtask"
bin = "xtask"
reason = "workspace automation (codegen from java.ungram) via the cargo-xtask pattern"

# --- Exclusions -------------------------------------------------------------
# `ast::generated` is emitted by `xtask codegen` from `java.ungram` with a
# uniform `pub` accessor surface. Per-accessor visibility is usage-dependent
# (the WIP `jals-fmt` rewrite is its consumer), so it cannot be narrowed from a
# structural template without breaking the accessors used cross-crate today.
[[exclude]]
crate = "jals_syntax"
module = "ast::generated"
reason = "generated AST; uniform pub surface from xtask codegen, consumer (jals-fmt) is WIP"

# The compile-backend tier is a documented, deliberately-unimplemented seam: no
# `impl Backend` exists yet, so nothing reaches its declarations from a shipped
# binary. See the `TODO(backend-tier)` note atop `jals-build/src/backend.rs`.
[[exclude]]
crate = "jals_build"
module = "backend"
reason = "deferred backend-tier compile seam; no impl exists yet (TODO(backend-tier))"

# `jals_fmt::import` lowers native formatter configs (Eclipse / IntelliJ / GJF /
# Palantir / Spotless) into a jals `Config`. It landed ahead of the WIP formatter
# rewrite, so no shipped binary reaches it yet — the CLI/LSP wiring that consumes
# it arrives with the rewrite. Each importer is a `Deserialize` model whose fields
# are read by serde, not by jals code, so the model surface stays `pub` by design.
[[exclude]]
crate = "jals_fmt"
module = "import"
reason = "config-importer surface for the WIP formatter rewrite; consumer wiring is not shipped yet"

# `jals_config::fmt` is the formatter's config *schema*: a serde data model whose
# fields are read by `serde` and — once the WIP `jals-fmt` rewrite lands — by the
# formatter itself. Nothing in a shipped binary reads them today, for the same
# reason `jals_fmt::import` is excluded above: the consumer is the rewrite. The
# `Layout` accessors are likewise rendering helpers the formatter will call.
# Narrowing the schema to `pub(crate)` would break `jalsfmt.toml`'s public
# surface and the importers that construct it.
[[exclude]]
crate = "jals_config"
module = "fmt"
reason = "formatter config schema for the WIP jals-fmt rewrite; its consumer is not shipped yet"

# --- Overrides --------------------------------------------------------------
# The backend seam's crate-root re-exports live outside the `backend` module,
# so they need per-item allows. Kept public as the stable surface the future
# `javac` backend adapter will implement and wire up (TODO(backend-tier)).
[[override]]
lint = "hawk::dead_public"
crate = "jals_build"
item = "Backend"
level = "allow"
reason = "deferred backend-tier seam; stable surface for the future javac adapter"

[[override]]
lint = "hawk::dead_public"
crate = "jals_build"
item = "BackendFuture"
level = "allow"
reason = "deferred backend-tier seam; stable surface for the future javac adapter"

[[override]]
lint = "hawk::dead_public"
crate = "jals_build"
item = "BackendSelection"
level = "allow"
reason = "deferred backend-tier seam; stable surface for the future javac adapter"

[[override]]
lint = "hawk::unnecessary_public"
crate = "jals_build"
item = "BackendAbsence"
level = "allow"
reason = "deferred backend-tier seam; stable surface for the future javac adapter"

[[override]]
lint = "hawk::unnecessary_public"
crate = "jals_build"
item = "BackendOptions"
level = "allow"
reason = "deferred backend-tier seam; stable surface for the future javac adapter"

[[override]]
lint = "hawk::unnecessary_public"
crate = "jals_build"
item = "BackendOutcome"
level = "allow"
reason = "deferred backend-tier seam; stable surface for the future javac adapter"

[[override]]
