# hawk.toml — declares the workspace's shipped binaries so `cargo hawk check`
# can run its closed-world visibility analysis. Each `[[production]]` entry is a
# reachability root: any `pub` item not reachable from one of these is a
# candidate for `hawk::dead_public` / `hawk::unnecessary_public`.
# See https://github.com/astral-sh/hawk for details.

[[production]]
package = "jals-cli"
bin = "jals"
reason = "primary shipped CLI: the Java formatter, LSP, and build front end"

[[production]]
package = "jals-playground"
bin = "jals-playground"
reason = "browser playground shipped as the wasm32 web frontend"

[[production]]
package = "jals-tests"
bin = "jals-tests"
reason = "corpus harness that parses real Java and reports parse-failure rates"

[[production]]
package = "jals-tests"
bin = "jals-golden"
reason = "golden harness comparing jals-fmt output against google-java-format"

[[production]]
package = "jals-tests"
bin = "jals-compile"
reason = "compiler harness scoring jals-javac output against a real JVM's bytecode verifier"

[[production]]
package = "xtask"
bin = "xtask"
reason = "workspace automation (codegen from java.ungram) via the cargo-xtask pattern"

# --- Exclusions -------------------------------------------------------------
# `ast::generated` is emitted by `xtask codegen` from `java.ungram` with a
# uniform `pub` accessor surface. Which accessors have a caller is usage-dependent
# and changes with every consumer, so the surface cannot be narrowed from a
# structural template without breaking the accessors used cross-crate today.
# Dropping this exclusion reports 214 findings, one per accessor with no caller.
[[exclude]]
crate = "jals_syntax"
module = "ast::generated"
reason = "generated AST; uniform pub accessor surface emitted from java.ungram by xtask codegen"

# `jals_fmt::import` lowers native formatter configs (Eclipse / IntelliJ / GJF /
# Palantir / Spotless) into a jals `Config`. `jals fmt` / `jals init` now reach the
# file-backed importers through `jals-cli/src/migrate.rs`, but three things here
# still have no caller by design: the google-/palantir-java-format models (those
# tools have no config file to detect, so they are constructed directly), the
# Spotless model (its Gradle/Maven DSL is code, not data — DESIGN.md P-gen-4), and
# the ~700 model *fields*, which are read by serde rather than by jals code.
[[exclude]]
crate = "jals_fmt"
module = "import"
reason = "serde-read native config models; the non-file importers have no detectable file"

# `jals_config::fmt` needed an exclusion only while the formatter that reads the
# schema did not exist: with nothing naming the individual fields, every one of
# them looked unreachable. `jals-fmt` now folds the whole schema in `Style::reify`
# and the visitors read it, so the gate holds on its own and the exclusion is
# gone. A key added to the schema but never consumed by the formatter is now a
# hawk finding — the same "declared but not implemented" failure
# `jals-fmt/tests/coverage.rs` guards from the other side.

# --- Overrides --------------------------------------------------------------
# `BackendSelection` / `BackendAbsence` needed overrides only while the factory
# they belong to did not exist: the CLI matched `[build] backend` itself and
# constructed the backend directly, so nothing reported absence as a *result* and
# every variant looked unreachable. Both hosts now call the factory — `for_host`
# in `jals-cli`, `in_process` in `jals-playground` — and both match on absence, so
# the gate holds on its own and the overrides are gone. A backend kind the
# selection stops answering is now a hawk finding.

# `backend_key` folds the frontend→backend pipeline provenance. Still unreached
# because backend output is not memoized yet: every build recompiles every
# source, so nothing asks the cache whether this compile already happened.
[[override]]
lint = "hawk::dead_public"
crate = "jals_frontend"
item = "key::backend_key::output"
level = "allow"
reason = "backend output is not memoized yet (CacheNamespace::BackendOutput unused)"

[[override]]
lint = "hawk::dead_public"
crate = "jals_frontend"
item = "key::backend_key::classpath"
level = "allow"
reason = "backend output is not memoized yet (CacheNamespace::BackendOutput unused)"
