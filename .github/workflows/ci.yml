name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

  # Every gate below (clippy, test, build, build-release) runs on linux, macOS, Windows *and* wasm.
  # The three host platforms take `--workspace`; wasm cannot, because the host crates (the CLI, the
  # LSP, the corpus harness) do not build for wasm32 at all — a whole-workspace wasm build is not a
  # thing that exists. So the wasm cells select packages, and the sets are defined once here rather
  # than per job: clippy, build, and build-release must judge *the same* package set as each other,
  # and a per-job copy of a nine-package list is exactly what drifts. The matrices reference them as
  # shell variables, which is also why every cargo step below is `shell: bash` — one command string
  # then means the same thing on all three hosts.
  #
  # Built as their own package set (no host crate in it), so the `std` features of jals-fmt /
  # jals-lint stay off and `#![no_std]` is enforced for the whole set.
  WASM_PACKAGES: >-
    --package jals-editor --package jals-syntax --package jals-classfile --package jals-hir
    --package jals-decompile --package jals-fmt --package jals-lint --package jals-storage
    --package jals-config
  # jals-classpath's HTTP/archive adapters are behind features; `--no-default-features` builds its
  # `no_std + alloc` storage-driven core. jals-build's host half (`SubprocessToolchain`, JDK
  # discovery + spawning) is likewise behind its `native` feature, so its no-`native` core is built
  # here too — the seam a future in-browser compiler implements. Both portable cores build together
  # here without host features.
  WASM_CORE_PACKAGES: >-
    --package jals-classpath --package jals-build --no-default-features
  # The `test (wasm)` cell: the crates whose *tests* need no host at all. Every other workspace
  # member tests a native adapter, and its dev-dependencies say so — they pull `jals-exec/tokio`
  # (tokio refuses to compile its `net` feature for wasm) or a `tempfile` scratch directory
  # (`std::env::temp_dir` is unimplemented on wasi). Including them would not fail a test, it would
  # fail the build, so the set is the portable computation crates: lexer/parser, HIR, lint, fmt,
  # config, decompile, editor, frontend, javac, classfile.
  WASM_TEST_PACKAGES: >-
    --package jals-syntax --package jals-hir --package jals-lint --package jals-fmt
    --package jals-config --package jals-decompile --package jals-editor --package jals-frontend
    --package jals-javac --package jals-classfile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ast-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.8
        with:
          tool: ast-grep
      - name: Run ast-grep rule tests
        run: ast-grep test --skip-snapshot-tests
      # `--error` is required to gate CI: a plain `ast-grep scan` exits 0 even when it
      # reports error-severity findings, so without it a rule violation would pass silently.
      - name: Scan the codebase against ast-grep rules
        run: ast-grep scan --error

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  codegen:
    name: generated code up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- codegen --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            args: --workspace --all-targets --all-features
          - name: macos
            runner: macos-latest
            args: --workspace --all-targets --all-features
          - name: windows
            runner: windows-latest
            args: --workspace --all-targets --all-features
          # The two wasm cells lint exactly what the `build` gate builds — same package sets, same
          # default target selection (lib + bin). Deliberately no `--all-targets`: that would pull in
          # the dev-dependency closure (tempfile, tokio's `net`, the `zip` fixture oracle), none of
          # which links for wasm32, so it would fail on the test *targets* rather than on any lint.
          - name: wasm
            runner: ubuntu-latest
            target: wasm32-unknown-unknown
            args: --target wasm32-unknown-unknown $WASM_PACKAGES
          - name: wasm-core
            runner: ubuntu-latest
            target: wasm32-unknown-unknown
            args: --target wasm32-unknown-unknown $WASM_CORE_PACKAGES
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed by cell, not by target: with three host platforms in one matrix a target-only key
          # would have macOS and Windows fighting over the same cache entry.
          key: clippy-${{ matrix.name }}
      - name: Run clippy
        shell: bash
        run: cargo clippy ${{ matrix.args }} -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      # On every host, not only linux: the JDK-backed tests stand themselves down when `javac` /
      # `java` is absent (`javac_available()` and friends), so a cell without a JDK is a cell that
      # passes by checking less — the same failure mode the `wasm-tools` note below guards against.
      - name: Set up JDK (for generated-source type checks)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
      # `wasm-tools` and `wasmtime` are the WasmGC backend's oracles: the tests that run a compiled
      # module skip themselves when the engine is absent (the same shape as `javac_available()`), so
      # without these installed the whole "a real engine executes it" half of `jals-javac` would
      # quietly pass by doing nothing.
      - uses: taiki-e/install-action@v2.85.8
        with:
          tool: nextest,wasm-tools,wasmtime
      # `--no-fail-fast`: with three host cells the first failure is the least interesting thing a
      # run can report. Stopping there hides the other 1600 tests' verdict on that platform, so a
      # platform-specific break costs one full CI round per failure to enumerate. The gate is
      # unchanged — a failed test still fails the job — only the report is complete.
      - name: Run the test suite
        shell: bash
        run: cargo nextest run --workspace --all-features --no-fail-fast
      # nextest does not run doctests, so keep them covered with a separate `cargo test --doc`.
      - name: Run the doctests
        shell: bash
        run: cargo test --workspace --all-features --doc

  test-wasm:
    name: test (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-wasm
      - uses: taiki-e/install-action@v2.85.8
        with:
          tool: wasmtime
      # `wasm32-wasip1`, not the shipped `wasm32-unknown-unknown`: the latter has no way to *run* a
      # test — no entry point, no stdout, no exit status — so testing on it would mean rewriting
      # every `#[test]` as a `wasm_bindgen_test` behind a headless browser. wasip1 runs the ordinary
      # libtest harness (doctests included) inside a real wasm engine, which is what this cell
      # claims and all it claims: the portable crates' own tests, executing as wasm.
      #
      # `--dir /::/` maps the host filesystem in unchanged. The fixture loaders bake
      # `env!("CARGO_MANIFEST_DIR")` in at compile time, so the guest opens absolute host paths.
      - name: Run the portable crates' tests under wasmtime
        shell: bash
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime --dir /::/"
        run: cargo test --target wasm32-wasip1 $WASM_TEST_PACKAGES

  taplo:
    name: taplo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
      - run: taplo fmt --check --diff

  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.8
        with:
          tool: cargo-machete
      - run: cargo machete

  unused-allow:
    name: cargo unused-allow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Not in taiki-e/install-action's prebuilt set, so it is compiled from source (cached above).
      # Version-pinned to match the rest of the workflow's tool pins.
      - run: cargo install cargo-unused-allow --version 0.4.0 --locked
      # Same target/feature scope as the clippy job, so "unused" is judged against the exact lint
      # configuration CI enforces: an `#[allow(...)]` that suppresses nothing under
      # `--all-targets --workspace --all-features` is flagged (exit 1) and fails the job.
      - run: cargo unused-allow --all-targets -- --workspace --all-features

  hawk:
    # One cell per *supported* host platform. There is deliberately no wasm cell: hawk's
    # reachability roots are the `[[production]]` binaries in hawk.toml — the `jals` CLI, both
    # corpus harnesses, xtask — and none of those build for wasm32, so a wasm closed-world analysis
    # would have no closed world to analyse. What the host cells differ on is which `#[cfg]` arms
    # exist, which is the reason to run the gate more than once at all.
    #
    # There is no Windows cell, and the reason is the tool rather than the workspace. hawk ships
    # linux and darwin tarballs plus the `sh` installer and nothing else — no Windows archive, no
    # `.ps1` — so a Windows cell has to build it from source against `rustc_private` under
    # `RUSTC_BOOTSTRAP=1` and hand the driver its `rustc_driver-*.dll`. That build runs, and then
    # answers wrong: it reported 201 findings against a tree both unix cells scored 0 on, and the
    # findings are not a `#[cfg]` difference. Every one of them lands in a *library* crate and none
    # in any of the five production roots, which is the shape of lost cross-crate edges rather than
    # of unreachable code — hence `jals_storage::cache`, which carries no platform `cfg` at all,
    # having its whole public surface (`ArtifactCache::publish`, `CacheKey`, `ContentDigest`)
    # called dead, alongside the playground-only `ProjectScript::resolve_memory`. A gate that
    # cannot see a call from `jals-cli` into `jals-storage` is not measuring visibility. Restore
    # the cell if hawk starts publishing a Windows build.
    name: cargo hawk (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
    env:
      # cargo-hawk release to install, pinned like the workflow's other tools. Hawk uses
      # `rustc_private`, so it is bound to one exact rustc: `HAWK_RUSTC` is that compiler, and
      # bumping `HAWK_VERSION` means bumping it to whatever the new release pins.
      HAWK_VERSION: "0.1.9"
      HAWK_RUSTC: "1.97.1"
    steps:
      - uses: actions/checkout@v7
      # The plain `HAWK_RUSTC` toolchain (minimal profile) is all a prebuilt hawk needs — it runs an
      # instrumented workspace build under this exact compiler. The compiler is selected by the
      # `toolchain` input, never by pinning the action ref to it: dependabot reads a `@1.97.1` ref
      # as the *action's* version and would keep opening PRs bumping it off hawk's rustc.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.HAWK_RUSTC }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: hawk-${{ matrix.name }}
      # Not in taiki-e/install-action's prebuilt set. The official cargo-dist installer drops
      # `cargo-hawk` and its `cargo-hawk-driver` into ~/.cargo/bin (on PATH); the version-pinned
      # release URL keeps the gate reproducible against the hawk.toml this workspace was tuned to.
      # A prebuilt release links no `rustc_private`, so it needs neither the `rustc-dev` component
      # nor `RUSTC_BOOTSTRAP=1` — which is the whole reason both cells here are unix.
      - name: Install cargo-hawk ${{ env.HAWK_VERSION }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh
          # Fail fast here (not mid-analysis) if the installer did not land the binary on PATH.
          cargo hawk --version
      # Closed-world visibility gate over the shipped binaries declared in hawk.toml. `-D warnings`
      # matches the locally-validated command and makes the gate explicit — every finding is an
      # error. `rustup run $HAWK_RUSTC` pins the instrumented build to hawk's compiler, independent
      # of the repo's default toolchain or any future toolchain file. Default features / host target
      # only, so the analysis set matches what hawk.toml was tuned against (no `--all-features`).
      - name: Run the closed-world visibility gate
        shell: bash
        run: rustup run "$HAWK_RUSTC" cargo hawk check -D warnings

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.8
        with:
          tool: typos
      - run: typos

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: biomejs/setup-biome@v2
        with:
          # Version-pinned like the rest of the workflow's tools; keep it in sync with the
          # `$schema` pin in `biome.json` so the CLI and the config schema never drift.
          version: 2.5.5
      # `biome ci` format- and lint-checks the JS sources (scoped by `biome.json`) without writing.
      # `--error-on-warnings` promotes every lint warning to a hard failure, so the gate is strict:
      # a plain `biome ci` exits 0 on warnings and would let a lint regression through silently.
      - run: biome ci --error-on-warnings

  build:
    # `build` and `build-release` are one job with a `profile` dimension, not two jobs with the same
    # eight-cell platform list written out twice — the second copy is where a target gets added to
    # one gate and not the other. The job *name* still resolves to the two gate names, so the checks
    # read `build (linux-x64)` and `build-release (linux-x64)`.
    name: ${{ matrix.profile == 'release' && 'build-release' || 'build' }} (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
        # Both architectures of all three host platforms, on native runners wherever GitHub has one
        # — a native build is a stronger signal than a cross build, and it drops the cross-linker
        # step this job used to need for aarch64 linux. The one exception is x86_64 macOS: there is
        # no separate runner to ask for, and the arm64 image's Xcode toolchain links both
        # architectures, so that cell cross-compiles (the same way the `lsp-binary` job below does).
        platform:
          - name: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packages: --workspace
          - name: linux-arm
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            packages: --workspace
          - name: macos-arm
            runner: macos-latest
            target: aarch64-apple-darwin
            packages: --workspace
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            packages: --workspace
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            packages: --workspace
          - name: windows-arm
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            packages: --workspace
          - name: wasm
            runner: ubuntu-latest
            target: wasm32-unknown-unknown
            packages: $WASM_PACKAGES
          - name: wasm-core
            runner: ubuntu-latest
            target: wasm32-unknown-unknown
            packages: $WASM_CORE_PACKAGES
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.profile }}-${{ matrix.platform.name }}
      - name: Build
        shell: bash
        run: >-
          cargo build ${{ matrix.profile == 'release' && '--release' || '' }}
          --target ${{ matrix.platform.target }} ${{ matrix.platform.packages }}

  portable-core:
    name: portable core and feature audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p jals-storage --no-default-features
      - run: cargo check -p jals-classpath --no-default-features
      - run: cargo check -p jals-build --no-default-features
      - run: cargo check -p jals-project --no-default-features
      # jals-frontend has no features at all, so a plain check *is* the portability check:
      # there is no configuration in which it stops being `no_std + alloc`.
      - run: cargo check -p jals-frontend
      - run: cargo check -p jals-project --all-features
      - run: cargo check -p jals-build --no-default-features --features rhai --target wasm32-unknown-unknown
      - run: cargo check -p jals-classpath --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p jals-project --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p jals-frontend --target wasm32-unknown-unknown
      - run: cargo build -p jals-playground --target wasm32-unknown-unknown
      - run: cargo tree -e features -p jals-classpath --no-default-features
      - run: cargo tree -e features -p jals-build --no-default-features
      - run: cargo tree -e features -p jals-project --no-default-features

  examples:
    # Every project under `examples/` is documentation that claims something builds, and a claim is
    # worth what a machine checks of it. One cell per example, each running the three gates a reader
    # runs from the example's own README — `jals build`, `jals fmt --check`, `jals lint` — against
    # the `jals` this commit produces rather than against an installed one.
    #
    # Beyond `name` and `dir` the cells differ only in the three optional fields below, so every
    # step is written once:
    #
    # - `features`: the selection the README's own command line uses. It is passed to `lint` as well
    #   as to `build`, because an unset selection resolves to the manifest's `default` list — for
    #   `minecraft_mod` a *different* release from the one just built, whose artifacts no offline
    #   analysis could then find.
    # - `run`: whether `[run] main-class` is something the example can actually run. It is a promise
    #   the manifest makes, and running it is the only thing that checks it.
    # - `publications`: set only for the SDK example, whose `jals build` is documented to end in
    #   `javac` errors (`examples/minecraft/README.md` §Compile-safety — the published skeleton tree
    #   is reference sources, not a compiling project). There the pipeline is what is gated: the
    #   publication is the *last* thing the script does, so three non-empty roots is exactly the
    #   statement "fetch → nested extract → remap → decompile → publish ran".
    #
    # Nothing here is cached between runs on purpose. The two Minecraft cells re-fetch and re-remap
    # a ~50 MiB game jar every time, which is the cost of the gate meaning what it says: build-task
    # results are memoized under a plan digest that no jals version participates in, so a restored
    # `target/jals` would let a change to this workspace reuse artifacts the change was supposed to
    # regenerate — a green cell that ran nothing.
    name: example (${{ matrix.example.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - name: hello_world
            dir: examples/hello_world
            run: true
          - name: rhai_build_script
            dir: examples/rhai_build_script
            run: true
          # The consumer is the entry point; `library/` is built through the dependency edge and has
          # no sources of its own to format or lint.
          - name: task_dependency
            dir: examples/task_dependency/consumer
            run: true
          # `[run] main-class` here names a `Main` that declares a field and defines no `main`, so
          # this one builds only — the example is about what a source archive publishes.
          - name: task_source_archive
            dir: examples/task_source_archive
          - name: minecraft
            dir: examples/minecraft
            features: --features 1.20.1
            publications: net/minecraft org/spongepowered com/llamalad7
          - name: minecraft_mod
            dir: examples/minecraft_mod
            features: --features 1.20.1
    steps:
      - uses: actions/checkout@v7
      # `hello_world` pins `release = 21`; the rest compile against the toolchain's own release, and
      # `minecraft_mod` compiles against class files from the game jar it selected. A current JDK
      # reads all of them, so one version serves every cell — the same one the `test` job installs.
      - name: Set up JDK (the examples compile and run with javac/java)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: examples
      # Release, not debug: the Minecraft cells decompress, remap and decompile a whole game jar,
      # and an unoptimized build turns that from a step into the job.
      - name: Build the jals binary
        run: cargo build --release --package jals-cli
      - name: Put jals on PATH
        run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      # Two examples start from `tasks.project_jar(...)` — a JAR in the project rather than behind a
      # pinned URL, which is what keeps them network-independent — and a JAR is a binary, so neither
      # is committed. The generator is the same one a reader runs, and it is unconditional here
      # rather than per-cell: it costs a second, and a flag whose only job is to skip it is a second
      # place the example list is written down.
      - name: Generate the vendor JARs the build-task examples read
        run: examples/scripts/gen-vendor-jars.sh
      - name: Build
        if: ${{ !matrix.example.publications }}
        working-directory: ${{ matrix.example.dir }}
        run: jals build ${{ matrix.example.features }}
      - name: Build the publication pipeline
        if: ${{ matrix.example.publications }}
        working-directory: ${{ matrix.example.dir }}
        # The `javac` step is expected to fail here and its status is deliberately dropped; every
        # earlier failure — a fetch, a remap, a decompile, the script itself — leaves a root empty
        # or absent and is caught below, so nothing is being waved through.
        run: |
          jals build ${{ matrix.example.features }} || echo "javac errors are expected (README §Compile-safety)"
          for root in ${{ matrix.example.publications }}; do
            count=$(find "src/main/java/$root" -name '*.java' 2>/dev/null | wc -l)
            echo "published $root: $count .java files"
            if [ "$count" -eq 0 ]; then
              echo "::error::the build script published nothing under src/main/java/$root"
              exit 1
            fi
          done
      - name: Run
        if: ${{ matrix.example.run }}
        working-directory: ${{ matrix.example.dir }}
        run: jals run ${{ matrix.example.features }}
      # After the build, not before it: an example whose dependency fetches (`minecraft_mod`) can
      # only be analysed once that fetch has landed in the verified cache, because analysis is
      # always offline.
      #
      # Tracked files only. Everything a build script publishes into a source root is untracked by
      # construction (the examples' `.gitignore`s reserve those roots), so `git ls-files` is what
      # separates the sources a reader wrote from the thousands of decompiled skeletons a task
      # produced — without a per-example list of directories that would drift the first time an
      # example gains one.
      - name: Check formatting and lint the authored sources
        working-directory: ${{ matrix.example.dir }}
        run: |
          mapfile -t sources < <(git ls-files -- '*.java')
          if [ ${#sources[@]} -eq 0 ]; then
            echo "no tracked Java sources in ${{ matrix.example.dir }}"
            exit 0
          fi
          printf 'checking %s\n' "${sources[@]}"
          jals fmt --check "${sources[@]}"
          jals lint ${{ matrix.example.features }} "${sources[@]}"

  setup-action:
    # The repository-root `action.yml` claims a consumer installs `jals` in one step. A claim is
    # worth what a machine checks of it, and checking this one needs release assets — which a pull
    # request does not have. So each cell *packs the archive this commit would publish*, points the
    # action at it through the `base-url` override the action already exposes for mirrors (the same
    # override the npm launcher takes as `JALS_INSTALL_BASE_URL`), and installs from that. Only the
    # address is substituted: the asset name, the sha256 companion, the verification, the
    # extraction, the tool-cache layout and the PATH export are all the production path.
    #
    # One cell per host platform, because the three differ in exactly the places this script can
    # break — the archive is a zip on Windows and a tarball elsewhere, and `sha256sum` is absent
    # from the macOS image, where the script falls back to `shasum`.
    name: setup-jals action (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: setup-action-${{ matrix.platform.name }}
      - name: Build the jals binary
        run: cargo build --release --package jals-cli
      - name: Pack the release archive this commit would publish
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.platform.target }}'
          case "$target" in
            *-pc-windows-msvc) extension=zip; bin=jals.exe ;;
            *) extension=tar.gz; bin=jals ;;
          esac
          # The version the action asks for is the one the binary reports, so this never drifts
          # from `jals-cli`'s Cargo.toml the way a second copy of the number would.
          version=$(target/release/"$bin" --version | awk '{print $2}')
          assets="$RUNNER_TEMP/jals-assets"
          rm -rf "$assets" && mkdir -p "$assets"
          cp "target/release/$bin" "$assets/$bin"
          archive="jals-v$version-$target.$extension"
          # `upload-rust-binary-action` puts the executable at the archive root, and both formats
          # are written by the same bsdtar/GNU tar the action later extracts them with.
          if [ "$extension" = zip ]; then
            (cd "$assets" && tar -a -cf "$archive" "$bin")
          else
            (cd "$assets" && tar -czf "$archive" "$bin")
          fi
          # The `<hex>  <filename>` line the release publishes beside every archive.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$assets" && sha256sum "$archive" > "$archive.sha256")
          else
            (cd "$assets" && shasum -a 256 "$archive" > "$archive.sha256")
          fi
          rm -f "$assets/$bin"
          # A `file://` URL needs a drive-letter path on Windows; `cygpath -m` is what turns the
          # runner's `D:\a\...` into one.
          if [ "$RUNNER_OS" = Windows ]; then
            echo "base-url=file:///$(cygpath -m "$assets")" >> "$GITHUB_OUTPUT"
          else
            echo "base-url=file://$assets" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install jals through the action
        id: setup
        uses: ./
        with:
          version: ${{ steps.pack.outputs.version }}
          base-url: ${{ steps.pack.outputs.base-url }}
          from-source: never
      - name: The installed jals is on PATH and is the one that was packed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.setup.outputs.source }}" = prebuilt
          test "${{ steps.setup.outputs.cache-hit }}" = false
          test "${{ steps.setup.outputs.version }}" = '${{ steps.pack.outputs.version }}'
          # `jals` resolved off PATH, not through the action's `path` output: the PATH export is
          # the half a consumer's later steps actually depend on.
          jals --version
          test "$(jals --version | awk '{print $2}')" = '${{ steps.pack.outputs.version }}'
      - name: A second install of the same version comes out of the tool cache
        id: again
        uses: ./
        with:
          version: ${{ steps.pack.outputs.version }}
          base-url: ${{ steps.pack.outputs.base-url }}
          from-source: never
      - name: The second install hit the cache
        shell: bash
        run: test "${{ steps.again.outputs.cache-hit }}" = true

  lsp-binary:
    name: lsp binary (${{ matrix.target }})
    # Per-platform `jals` binaries for the Zed extension's auto-download: the extension asks
    # the GitHub API for the newest of these artifacts on `main` and fetches its zip through
    # nightly.link (GitHub's own artifact-download endpoint requires authentication, even on a
    # public repository). Push-to-main only — the extension never downloads a PR build, so a
    # per-PR five-target build would be wasted.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # Cross-compiled from the arm64 macOS runner (the Xcode toolchain links both archs).
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: lsp-binary-${{ matrix.target }}
      - name: Build the jals binary
        run: cargo build --release --target ${{ matrix.target }} --package jals-cli
      - name: Upload the jals binary
        uses: actions/upload-artifact@v7
        with:
          # The artifact name the extension derives from `zed::current_platform()`; keep the
          # two in sync (`artifact_name` in editors/zed/src/lib.rs).
          name: jals-${{ matrix.target }}
          # Exactly one of the two patterns matches (`jals.exe` on Windows), so the artifact
          # zip holds the binary at its root — which is where the extension expects it.
          path: |
            target/${{ matrix.target }}/release/jals
            target/${{ matrix.target }}/release/jals.exe
          if-no-files-found: error

  zed-extension:
    name: zed extension
    runs-on: ubuntu-latest
    env:
      # The wasi-preview1 reactor adapter used to component-encode the extension, pinned to the
      # wasmtime release Zed's extension host tracks (`wasmtime` in zed-industries/zed's
      # Cargo.toml). Zed loads a wasm *component*, but `cargo build` emits a core module, so the
      # module is adapted into a component with this exact adapter — matching Zed's own build so
      # the artifact loads. Bump this when Zed bumps its wasmtime.
      WASMTIME_VERSION: "36.0.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # The extension (`editors/zed`) is its own workspace root (excluded from the outer one), so
      # its target dir is `editors/zed/target`.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      # Installs the wasm-tools binary directly into the tool dir each run, so (unlike a
      # `cargo binstall` keyed off `.crates.toml`) the `rust-cache` step's restored install
      # metadata can't make it skip placing the binary the component-encode step needs.
      - uses: taiki-e/install-action@v2.85.8
        with:
          tool: wasm-tools
      - name: Build the extension (wasm32-wasip1 core module)
        run: cargo build --release --locked --target wasm32-wasip1 --manifest-path editors/zed/Cargo.toml
      - name: Download the wasi-preview1 reactor adapter
        run: |
          curl -fL --retry 3 \
            -o wasi_snapshot_preview1.reactor.wasm \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasi_snapshot_preview1.reactor.wasm"
      - name: Component-encode the extension
        run: |
          mkdir -p dist
          wasm-tools component new \
            editors/zed/target/wasm32-wasip1/release/zed_jals.wasm \
            --adapt "wasi_snapshot_preview1=wasi_snapshot_preview1.reactor.wasm" \
            -o dist/extension.wasm
          cp editors/zed/extension.toml dist/extension.toml
      - name: Upload the compiled extension
        uses: actions/upload-artifact@v7
        with:
          name: zed-jals-extension
          # The compiled Zed extension: the component `extension.wasm` + its `extension.toml`.
          path: dist/
          if-no-files-found: error

  corpus-reports:
    name: corpus reports
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pinned reference-formatter releases the generated OpenJDK corpora are built with.
      # A similarity score is only defined against a fixed reference version
      # (`jals-fmt/DESIGN.md` §7.1), so these are part of the metric, not build trivia.
      # `jals_tests::golden::TOOL_PINS` restates them and `the_tool_pins_match_ci` fails
      # when the two drift — bump both together (and, for JDT, the coordinate list in
      # `jals-tests/scripts/fetch-eclipse-jdt.sh`).
      GJF_VERSION: "1.35.0"
      PJF_VERSION: "2.96.0"
      ECLIPSE_JDT_VERSION: "3.46.0"
      IDEA_VERSION: "2025.3"
    steps:
      - uses: actions/checkout@v7
        with:
          # Every corpus: OpenJDK (parse soundness) plus the google-java-format and
          # palantir-java-format regression suites (fidelity).
          submodules: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the corpus tools
        run: cargo build --release -p jals-tests --bins
      - name: Set up JDK (for google-java-format and Eclipse JDT)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache the google-java-format jar
        id: gjf-jar
        uses: actions/cache@v6
        with:
          # Immutable per release, so the version alone keys it.
          path: jals-tests/vendor/google-java-format-${{ env.GJF_VERSION }}-all-deps.jar
          key: gjf-jar-${{ env.GJF_VERSION }}
      - name: Download the google-java-format jar
        if: steps.gjf-jar.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --create-dirs \
            -o "jals-tests/vendor/google-java-format-${GJF_VERSION}-all-deps.jar" \
            "https://github.com/google/google-java-format/releases/download/v${GJF_VERSION}/google-java-format-${GJF_VERSION}-all-deps.jar"
      - name: Cache the palantir-java-format binary
        id: pjf-bin
        uses: actions/cache@v6
        with:
          path: jals-tests/vendor/palantir-java-format-${{ env.PJF_VERSION }}
          key: pjf-bin-${{ env.PJF_VERSION }}
      - name: Download the palantir-java-format binary
        if: steps.pjf-bin.outputs.cache-hit != 'true'
        # A GraalVM native image published to Maven Central: one self-contained x86-64
        # Linux binary, so unlike google-java-format there is no JVM or dependency
        # closure to assemble. Palantir attaches no assets to its GitHub releases.
        run: |
          curl -fL --retry 3 --create-dirs \
            -o "jals-tests/vendor/palantir-java-format-${PJF_VERSION}" \
            "https://repo1.maven.org/maven2/com/palantir/javaformat/palantir-java-format-native/${PJF_VERSION}/palantir-java-format-native-${PJF_VERSION}-nativeImage-linux-glibc_x86-64.bin"
          chmod +x "jals-tests/vendor/palantir-java-format-${PJF_VERSION}"
      - name: Cache the Eclipse JDT jars
        id: jdt-jars
        uses: actions/cache@v6
        with:
          path: jals-tests/vendor/eclipse-jdt
          key: jdt-jars-${{ env.ECLIPSE_JDT_VERSION }}-${{ hashFiles('jals-tests/scripts/fetch-eclipse-jdt.sh') }}
      - name: Resolve the Eclipse JDT classpath
        id: jdt
        # Fetches only what is missing, so this is a no-op on a cache hit and still yields
        # the classpath the generator needs.
        run: echo "classpath=$(jals-tests/scripts/fetch-eclipse-jdt.sh)" >> "$GITHUB_OUTPUT"
      - name: Resolve the OpenJDK submodule commit
        id: openjdk
        # Reads the gitlink the superproject pins, no submodule history needed.
        run: echo "sha=$(git rev-parse HEAD:jals-tests/sources/openjdk)" >> "$GITHUB_OUTPUT"

      # One cache + one generation step per reference formatter. Each corpus is generated,
      # never committed (they are GPL'd OpenJDK derivatives), and regenerated only when the
      # submodule pin, that tool's version, or the shared generator changes.
      #
      # Every generation step is `continue-on-error`, which is what actually makes the steps
      # independent: without it a failing generator fails the job, the report step never
      # runs, and no comment is posted at all — one broken formatter would cost every row.
      # Soft-failing instead leaves the corpus directory absent, which `--allow-missing`
      # below turns into a skipped row with a note. This report is informational by
      # construction (see `jals-tests/README.md`), so it is never the thing gating a PR.
      - name: Cache the OpenJDK src/ gjf corpus
        id: gjf-corpus
        uses: actions/cache@v6
        with:
          path: jals-tests/sources/openjdk-gjf
          key: openjdk-gjf-src-${{ env.GJF_VERSION }}-${{ steps.openjdk.outputs.sha }}-${{ hashFiles('jals-tests/scripts/gen-openjdk-corpus.sh') }}
      - name: Generate the OpenJDK src/ gjf corpus
        continue-on-error: true
        if: steps.gjf-corpus.outputs.cache-hit != 'true'
        env:
          GJF_JAR: jals-tests/vendor/google-java-format-${{ env.GJF_VERSION }}-all-deps.jar
          SUBTREE: src
          JOBS: "2"
        run: jals-tests/scripts/gen-openjdk-corpus.sh gjf 0

      - name: Cache the OpenJDK src/ palantir corpus
        id: palantir-corpus
        uses: actions/cache@v6
        with:
          path: jals-tests/sources/openjdk-palantir
          key: openjdk-palantir-src-${{ env.PJF_VERSION }}-${{ steps.openjdk.outputs.sha }}-${{ hashFiles('jals-tests/scripts/gen-openjdk-corpus.sh') }}
      - name: Generate the OpenJDK src/ palantir corpus
        continue-on-error: true
        if: steps.palantir-corpus.outputs.cache-hit != 'true'
        env:
          PJF_BIN: jals-tests/vendor/palantir-java-format-${{ env.PJF_VERSION }}
          SUBTREE: src
          JOBS: "2"
        run: jals-tests/scripts/gen-openjdk-corpus.sh palantir 0

      - name: Cache the OpenJDK src/ eclipse corpus
        id: eclipse-corpus
        uses: actions/cache@v6
        with:
          # The committed profile is part of the key: change the style and the corpus it
          # produced is no longer the one the harness scores against.
          path: jals-tests/sources/openjdk-eclipse
          key: openjdk-eclipse-src-${{ env.ECLIPSE_JDT_VERSION }}-${{ steps.openjdk.outputs.sha }}-${{ hashFiles('jals-tests/scripts/gen-openjdk-corpus.sh', 'jals-tests/scripts/eclipse/EclipseFormat.java', 'jals-tests/config/eclipse-jals.prefs') }}
      - name: Generate the OpenJDK src/ eclipse corpus
        continue-on-error: true
        if: steps.eclipse-corpus.outputs.cache-hit != 'true'
        env:
          ECLIPSE_CP: ${{ steps.jdt.outputs.classpath }}
          SUBTREE: src
          JOBS: "2"
        run: jals-tests/scripts/gen-openjdk-corpus.sh eclipse 0

      - name: Cache the OpenJDK java.base intellij corpus
        id: intellij-corpus
        uses: actions/cache@v6
        with:
          path: jals-tests/sources/openjdk-intellij
          key: openjdk-intellij-javabase-${{ env.IDEA_VERSION }}-${{ steps.openjdk.outputs.sha }}-${{ hashFiles('jals-tests/scripts/gen-openjdk-corpus.sh', 'jals-tests/config/intellij-jals.xml') }}
      - name: Download IntelliJ IDEA
        id: idea
        continue-on-error: true
        # Only on a corpus cache miss: this is a ~1.5 GB download that would otherwise
        # crowd out the corpus caches themselves, so the IDE is fetched rather than cached.
        #
        # The unified distribution, not `ideaIC-*`: IntelliJ IDEA Community Edition stopped
        # shipping as a separate download at 2025.3, and everything it used to contain —
        # the Java code formatter this step drives included — stays free in the one
        # distribution, for commercial use as well. No license is involved.
        if: steps.intellij-corpus.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o idea.tar.gz \
            "https://download.jetbrains.com/idea/idea-${IDEA_VERSION}.tar.gz"
          mkdir -p jals-tests/vendor/idea
          tar xzf idea.tar.gz -C jals-tests/vendor/idea --strip-components=1
          rm idea.tar.gz
      - name: Generate the OpenJDK java.base intellij corpus
        continue-on-error: true
        if: steps.intellij-corpus.outputs.cache-hit != 'true'
        env:
          IDEA_HOME: jals-tests/vendor/idea
          # Only `java.base`, not all of `src/`: the IDEA formatter runs a whole IDE and is
          # an order of magnitude slower than the other three. The narrower subtree is
          # named in the corpus description so the report cannot read as full coverage.
          SUBTREE: src/java.base
        run: jals-tests/scripts/gen-openjdk-corpus.sh intellij 0

      - name: Generate corpus reports
        shell: bash
        run: |
          set -o pipefail
          {
            cargo run --release -p jals-tests --bin jals-tests -- --markdown
            echo
            cargo run --release -p jals-tests --bin jals-golden -- \
              --worst 20 --allow-missing --markdown
          } | tee corpus.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment corpus reports on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('corpus.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: corpus-reports
          path: corpus.md
