name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ast-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.2
        with:
          tool: ast-grep
      - name: Run ast-grep rule tests
        run: ast-grep test --skip-snapshot-tests
      # `--error` is required to gate CI: a plain `ast-grep scan` exits 0 even when it
      # reports error-severity findings, so without it a rule violation would pass silently.
      - name: Scan the codebase against ast-grep rules
        run: ast-grep scan --error

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  codegen:
    name: generated code up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- codegen --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK (for generated-source type checks)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `wasm-tools` and `wasmtime` are the WasmGC backend's oracles: the tests that run a compiled
      # module skip themselves when the engine is absent (the same shape as `javac_available()`), so
      # without these installed the whole "a real engine executes it" half of `jals-javac` would
      # quietly pass by doing nothing.
      - uses: taiki-e/install-action@v2.85.2
        with:
          tool: nextest,wasm-tools,wasmtime
      - run: cargo nextest run --workspace --all-features
      # nextest does not run doctests, so keep them covered with a separate `cargo test --doc`.
      - run: cargo test --workspace --all-features --doc

  taplo:
    name: taplo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
      - run: taplo fmt --check --diff

  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.2
        with:
          tool: cargo-machete
      - run: cargo machete

  unused-allow:
    name: cargo unused-allow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Not in taiki-e/install-action's prebuilt set, so it is compiled from source (cached above).
      # Version-pinned to match the rest of the workflow's tool pins.
      - run: cargo install cargo-unused-allow --version 0.4.0 --locked
      # Same target/feature scope as the clippy job, so "unused" is judged against the exact lint
      # configuration CI enforces: an `#[allow(...)]` that suppresses nothing under
      # `--all-targets --workspace --all-features` is flagged (exit 1) and fails the job.
      - run: cargo unused-allow --all-targets -- --workspace --all-features

  hawk:
    name: cargo hawk
    runs-on: ubuntu-latest
    env:
      # cargo-hawk release to install, pinned like the workflow's other tools. Hawk uses
      # `rustc_private`, so it is bound to one exact rustc: `HAWK_RUSTC` is that compiler, and
      # bumping `HAWK_VERSION` means bumping it to whatever the new release pins.
      HAWK_VERSION: "0.1.9"
      HAWK_RUSTC: "1.97.1"
    steps:
      - uses: actions/checkout@v7
      # The plain `HAWK_RUSTC` toolchain (minimal profile) is all the *prebuilt* hawk needs — it
      # runs an instrumented workspace build under this exact compiler. No rustc-dev /
      # RUSTC_BOOTSTRAP / source build (those are only for `cargo install`-ing hawk). The compiler
      # is selected by the `toolchain` input, never by pinning the action ref to it: dependabot
      # reads a `@1.97.1` ref as the *action's* version and would keep opening PRs bumping it off
      # hawk's rustc.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.HAWK_RUSTC }}
      - uses: Swatinem/rust-cache@v2
      # Not in taiki-e/install-action's prebuilt set. The official cargo-dist installer drops
      # `cargo-hawk` and its `cargo-hawk-driver` into ~/.cargo/bin (on PATH); the version-pinned
      # release URL keeps the gate reproducible against the hawk.toml this workspace was tuned to.
      # A prebuilt release needs no rustc-dev, so this is far cheaper than a source install.
      - name: Install cargo-hawk ${{ env.HAWK_VERSION }} (prebuilt)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh
          # Fail fast here (not mid-analysis) if the installer did not land the binary on PATH.
          cargo hawk --version
      # Closed-world visibility gate over the shipped binaries declared in hawk.toml. `-D warnings`
      # matches the locally-validated command and makes the gate explicit — every finding is an
      # error. `+$HAWK_RUSTC` pins the instrumented build to hawk's compiler, independent of the
      # repo's default toolchain or any future toolchain file. Default features / host target only,
      # so the analysis set matches what hawk.toml was tuned against (do not add `--all-features`).
      - run: cargo "+$HAWK_RUSTC" hawk check -D warnings

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.2
        with:
          tool: typos
      - run: typos

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: biomejs/setup-biome@v2
        with:
          # Version-pinned like the rest of the workflow's tools; keep it in sync with the
          # `$schema` pin in `biome.json` so the CLI and the config schema never drift.
          version: 2.5.5
      # `biome ci` format- and lint-checks the JS sources (scoped by `biome.json`) without writing.
      # `--error-on-warnings` promotes every lint warning to a hard failure, so the gate is strict:
      # a plain `biome ci` exits 0 on warnings and would let a lint regression through silently.
      - run: biome ci --error-on-warnings

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-gnu
            packages: --workspace
          - name: linux-arm
            target: aarch64-unknown-linux-gnu
            packages: --workspace
          # Built as their own package set (no host crate in it), so the `std` features of
          # jals-fmt / jals-lint stay off and `#![no_std]` is enforced for the whole set.
          - name: wasm
            target: wasm32-unknown-unknown
            packages: --package jals-editor --package jals-syntax --package jals-classfile --package jals-hir --package jals-decompile --package jals-fmt --package jals-lint --package jals-storage --package jals-config
          # jals-classpath's HTTP/archive adapters are behind features;
          # `--no-default-features` builds its `no_std + alloc` storage-driven core. jals-build's
          # host half (`SubprocessToolchain`, JDK
          # discovery + spawning) is likewise behind its `native` feature, so its no-`native` core
          # is built here too — the seam a future in-browser compiler implements. Both are
          # portable cores build together here without host features.
          - name: wasm-classpath
            target: wasm32-unknown-unknown
            packages: --package jals-classpath --package jals-build --no-default-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.packages }}

  portable-core:
    name: portable core and feature audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p jals-storage --no-default-features
      - run: cargo check -p jals-classpath --no-default-features
      - run: cargo check -p jals-build --no-default-features
      - run: cargo check -p jals-project --no-default-features
      # jals-frontend has no features at all, so a plain check *is* the portability check:
      # there is no configuration in which it stops being `no_std + alloc`.
      - run: cargo check -p jals-frontend
      - run: cargo check -p jals-project --all-features
      - run: cargo check -p jals-build --no-default-features --features rhai --target wasm32-unknown-unknown
      - run: cargo check -p jals-classpath --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p jals-project --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p jals-frontend --target wasm32-unknown-unknown
      - run: cargo build -p jals-playground --target wasm32-unknown-unknown
      - run: cargo tree -e features -p jals-classpath --no-default-features
      - run: cargo tree -e features -p jals-build --no-default-features
      - run: cargo tree -e features -p jals-project --no-default-features

  lsp-binary:
    name: lsp binary (${{ matrix.target }})
    # Per-platform `jals` binaries for the Zed extension's auto-download: the extension asks
    # the GitHub API for the newest of these artifacts on `main` and fetches its zip through
    # nightly.link (GitHub's own artifact-download endpoint requires authentication, even on a
    # public repository). Push-to-main only — the extension never downloads a PR build, so a
    # per-PR five-target build would be wasted.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # Cross-compiled from the arm64 macOS runner (the Xcode toolchain links both archs).
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: lsp-binary-${{ matrix.target }}
      - name: Build the jals binary
        run: cargo build --release --target ${{ matrix.target }} --package jals-cli
      - name: Upload the jals binary
        uses: actions/upload-artifact@v7
        with:
          # The artifact name the extension derives from `zed::current_platform()`; keep the
          # two in sync (`artifact_name` in editors/zed/src/lib.rs).
          name: jals-${{ matrix.target }}
          # Exactly one of the two patterns matches (`jals.exe` on Windows), so the artifact
          # zip holds the binary at its root — which is where the extension expects it.
          path: |
            target/${{ matrix.target }}/release/jals
            target/${{ matrix.target }}/release/jals.exe
          if-no-files-found: error

  zed-extension:
    name: zed extension
    runs-on: ubuntu-latest
    env:
      # The wasi-preview1 reactor adapter used to component-encode the extension, pinned to the
      # wasmtime release Zed's extension host tracks (`wasmtime` in zed-industries/zed's
      # Cargo.toml). Zed loads a wasm *component*, but `cargo build` emits a core module, so the
      # module is adapted into a component with this exact adapter — matching Zed's own build so
      # the artifact loads. Bump this when Zed bumps its wasmtime.
      WASMTIME_VERSION: "36.0.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # The extension (`editors/zed`) is its own workspace root (excluded from the outer one), so
      # its target dir is `editors/zed/target`.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      # Installs the wasm-tools binary directly into the tool dir each run, so (unlike a
      # `cargo binstall` keyed off `.crates.toml`) the `rust-cache` step's restored install
      # metadata can't make it skip placing the binary the component-encode step needs.
      - uses: taiki-e/install-action@v2.85.2
        with:
          tool: wasm-tools
      - name: Build the extension (wasm32-wasip1 core module)
        run: cargo build --release --locked --target wasm32-wasip1 --manifest-path editors/zed/Cargo.toml
      - name: Download the wasi-preview1 reactor adapter
        run: |
          curl -fL --retry 3 \
            -o wasi_snapshot_preview1.reactor.wasm \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasi_snapshot_preview1.reactor.wasm"
      - name: Component-encode the extension
        run: |
          mkdir -p dist
          wasm-tools component new \
            editors/zed/target/wasm32-wasip1/release/zed_jals.wasm \
            --adapt "wasi_snapshot_preview1=wasi_snapshot_preview1.reactor.wasm" \
            -o dist/extension.wasm
          cp editors/zed/extension.toml dist/extension.toml
      - name: Upload the compiled extension
        uses: actions/upload-artifact@v7
        with:
          name: zed-jals-extension
          # The compiled Zed extension: the component `extension.wasm` + its `extension.toml`.
          path: dist/
          if-no-files-found: error

  corpus-reports:
    name: corpus reports
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pinned reference-formatter releases the generated OpenJDK corpora are built with.
      # A similarity score is only defined against a fixed reference version
      # (`jals-fmt/DESIGN.md` §7.1), so these are part of the metric, not build trivia.
      # `jals_tests::golden::TOOL_PINS` restates them and `the_tool_pins_match_ci` fails
      # when the two drift — bump both together (and, for JDT, the coordinate list in
      # `jals-tests/scripts/fetch-eclipse-jdt.sh`).
      GJF_VERSION: "1.35.0"
      PJF_VERSION: "2.96.0"
      ECLIPSE_JDT_VERSION: "3.46.0"
      IDEA_VERSION: "2025.3"
    steps:
      - uses: actions/checkout@v7
        with:
          # Every corpus: OpenJDK (parse soundness) plus the google-java-format and
          # palantir-java-format regression suites (fidelity).
          submodules: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the corpus tools
        run: cargo build --release -p jals-tests --bins
      - name: Set up JDK (for google-java-format and Eclipse JDT)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache the google-java-format jar
        id: gjf-jar
        uses: actions/cache@v6
        with:
          # Immutable per release, so the version alone keys it.
          path: jals-tests/vendor/google-java-format-${{ env.GJF_VERSION }}-all-deps.jar
          key: gjf-jar-${{ env.GJF_VERSION }}
      - name: Download the google-java-format jar
        if: steps.gjf-jar.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --create-dirs \
            -o "jals-tests/vendor/google-java-format-${GJF_VERSION}-all-deps.jar" \
            "https://github.com/google/google-java-format/releases/download/v${GJF_VERSION}/google-java-format-${GJF_VERSION}-all-deps.jar"
      - name: Cache the palantir-java-format binary
        id: pjf-bin
        uses: actions/cache@v6
        with:
          path: jals-tests/vendor/palantir-java-format-${{ env.PJF_VERSION }}
          key: pjf-bin-${{ env.PJF_VERSION }}
      - name: Download the palantir-java-format binary
        if: steps.pjf-bin.outputs.cache-hit != 'true'
        # A GraalVM native image published to Maven Central: one self-contained x86-64
        # Linux binary, so unlike google-java-format there is no JVM or dependency
        # closure to assemble. Palantir attaches no assets to its GitHub releases.
        run: |
          curl -fL --retry 3 --create-dirs \
            -o "jals-tests/vendor/palantir-java-format-${PJF_VERSION}" \
            "https://repo1.maven.org/maven2/com/palantir/javaformat/palantir-java-format-native/${PJF_VERSION}/palantir-java-format-native-${PJF_VERSION}-nativeImage-linux-glibc_x86-64.bin"
          chmod +x "jals-tests/vendor/palantir-java-format-${PJF_VERSION}"
      - name: Cache the Eclipse JDT jars
        id: jdt-jars
        uses: actions/cache@v6
        with:
          path: jals-tests/vendor/eclipse-jdt
          key: jdt-jars-${{ env.ECLIPSE_JDT_VERSION }}-${{ hashFiles('jals-tests/scripts/fetch-eclipse-jdt.sh') }}
      - name: Resolve the Eclipse JDT classpath
        id: jdt
        # Fetches only what is missing, so this is a no-op on a cache hit and still yields
        # the classpath the generator needs.
        run: echo "classpath=$(jals-tests/scripts/fetch-eclipse-jdt.sh)" >> "$GITHUB_OUTPUT"
      - name: Resolve the OpenJDK submodule commit
        id: openjdk
        # Reads the gitlink the superproject pins, no submodule history needed.
        run: echo "sha=$(git rev-parse HEAD:jals-tests/sources/openjdk)" >> "$GITHUB_OUTPUT"

      # One cache + one generation step per reference formatter. Each corpus is generated,
      # never committed (they are GPL'd OpenJDK derivatives), and regenerated only when the
      # submodule pin, that tool's version, or the shared generator changes.
      #
      # Every generation step is `continue-on-error`, which is what actually makes the steps
      # independent: without it a failing generator fails the job, the report step never
      # runs, and no comment is posted at all — one broken formatter would cost every row.
      # Soft-failing instead leaves the corpus directory absent, which `--allow-missing`
      # below turns into a skipped row with a note. This report is informational by
      # construction (see `jals-tests/README.md`), so it is never the thing gating a PR.
      - name: Cache the OpenJDK src/ gjf corpus
        id: gjf-corpus
        uses: actions/cache@v6
        with:
          path: jals-tests/sources/openjdk-gjf
          key: openjdk-gjf-src-${{ env.GJF_VERSION }}-${{ steps.openjdk.outputs.sha }}-${{ hashFiles('jals-tests/scripts/gen-openjdk-corpus.sh') }}
      - name: Generate the OpenJDK src/ gjf corpus
        continue-on-error: true
        if: steps.gjf-corpus.outputs.cache-hit != 'true'
        env:
          GJF_JAR: jals-tests/vendor/google-java-format-${{ env.GJF_VERSION }}-all-deps.jar
          SUBTREE: src
          JOBS: "2"
        run: jals-tests/scripts/gen-openjdk-corpus.sh gjf 0

      - name: Cache the OpenJDK src/ palantir corpus
        id: palantir-corpus
        uses: actions/cache@v6
        with:
          path: jals-tests/sources/openjdk-palantir
          key: openjdk-palantir-src-${{ env.PJF_VERSION }}-${{ steps.openjdk.outputs.sha }}-${{ hashFiles('jals-tests/scripts/gen-openjdk-corpus.sh') }}
      - name: Generate the OpenJDK src/ palantir corpus
        continue-on-error: true
        if: steps.palantir-corpus.outputs.cache-hit != 'true'
        env:
          PJF_BIN: jals-tests/vendor/palantir-java-format-${{ env.PJF_VERSION }}
          SUBTREE: src
          JOBS: "2"
        run: jals-tests/scripts/gen-openjdk-corpus.sh palantir 0

      - name: Cache the OpenJDK src/ eclipse corpus
        id: eclipse-corpus
        uses: actions/cache@v6
        with:
          # The committed profile is part of the key: change the style and the corpus it
          # produced is no longer the one the harness scores against.
          path: jals-tests/sources/openjdk-eclipse
          key: openjdk-eclipse-src-${{ env.ECLIPSE_JDT_VERSION }}-${{ steps.openjdk.outputs.sha }}-${{ hashFiles('jals-tests/scripts/gen-openjdk-corpus.sh', 'jals-tests/scripts/eclipse/EclipseFormat.java', 'jals-tests/config/eclipse-jals.prefs') }}
      - name: Generate the OpenJDK src/ eclipse corpus
        continue-on-error: true
        if: steps.eclipse-corpus.outputs.cache-hit != 'true'
        env:
          ECLIPSE_CP: ${{ steps.jdt.outputs.classpath }}
          SUBTREE: src
          JOBS: "2"
        run: jals-tests/scripts/gen-openjdk-corpus.sh eclipse 0

      - name: Cache the OpenJDK java.base intellij corpus
        id: intellij-corpus
        uses: actions/cache@v6
        with:
          path: jals-tests/sources/openjdk-intellij
          key: openjdk-intellij-javabase-${{ env.IDEA_VERSION }}-${{ steps.openjdk.outputs.sha }}-${{ hashFiles('jals-tests/scripts/gen-openjdk-corpus.sh', 'jals-tests/config/intellij-jals.xml') }}
      - name: Download IntelliJ IDEA
        id: idea
        continue-on-error: true
        # Only on a corpus cache miss: this is a ~1.5 GB download that would otherwise
        # crowd out the corpus caches themselves, so the IDE is fetched rather than cached.
        #
        # The unified distribution, not `ideaIC-*`: IntelliJ IDEA Community Edition stopped
        # shipping as a separate download at 2025.3, and everything it used to contain —
        # the Java code formatter this step drives included — stays free in the one
        # distribution, for commercial use as well. No license is involved.
        if: steps.intellij-corpus.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o idea.tar.gz \
            "https://download.jetbrains.com/idea/idea-${IDEA_VERSION}.tar.gz"
          mkdir -p jals-tests/vendor/idea
          tar xzf idea.tar.gz -C jals-tests/vendor/idea --strip-components=1
          rm idea.tar.gz
      - name: Generate the OpenJDK java.base intellij corpus
        continue-on-error: true
        if: steps.intellij-corpus.outputs.cache-hit != 'true'
        env:
          IDEA_HOME: jals-tests/vendor/idea
          # Only `java.base`, not all of `src/`: the IDEA formatter runs a whole IDE and is
          # an order of magnitude slower than the other three. The narrower subtree is
          # named in the corpus description so the report cannot read as full coverage.
          SUBTREE: src/java.base
        run: jals-tests/scripts/gen-openjdk-corpus.sh intellij 0

      - name: Generate corpus reports
        shell: bash
        run: |
          set -o pipefail
          {
            cargo run --release -p jals-tests --bin jals-tests -- --markdown
            echo
            cargo run --release -p jals-tests --bin jals-golden -- \
              --worst 20 --allow-missing --markdown
          } | tee corpus.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment corpus reports on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('corpus.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: corpus-reports
          path: corpus.md
