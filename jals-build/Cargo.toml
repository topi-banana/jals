[package]
name = "jals-build"
version.workspace = true
edition.workspace = true

[features]
# On by default: the host `SubprocessToolchain` (JDK discovery + `javac`/`java` spawning) and the
# `<dyn Toolchain>::select` backend factory and native project-storage adapter in `native.rs`.
# Portable target/scaffold planning stays filesystem/process-free, so `--no-default-features` builds a
# `wasm32`-compatible core a future in-browser compiler can implement.
default = ["native"]
native = ["jals-storage/std", "jals-exec/tokio"]
rhai = ["dep:rhai", "dep:serde", "dep:serde_json"]
# Runs what the `jals-wasm` backend emits. Off by default and independent of `native` for the same
# reason `rhai` is a feature: it is the one dependency in this crate pinned to an unpublished
# revision, and every consumer of the portable core should not inherit that. Portable itself — the
# engine is an interpreter over `core + alloc`, so `jals-cli` and the browser enable the same
# feature and reach the same code.
wasm-run = ["dep:tinywasm"]

[dependencies]
# The in-process compile backend. Portable in every configuration, like the `Backend` contract it
# implements, so `--no-default-features` still gets a backend that works.
jals-javac = { workspace = true }
jals-hir = { workspace = true }
jals-syntax = { workspace = true }
# The pure `jals.toml` model (`Manifest` and friends) lives in `jals-config`; `jals-build` adds the
# host-only `std::path`-based resolution (`ManifestExt`) on top. `toml` remains for `ManifestError`'s
# `toml::de::Error` field type. `jals-storage` supplies typed project keys, revisions, and the
# memory/native aggregate used by the builtin backend. `jals-exec` supplies the execution context
# handle and the blocking-pool escape the native half runs its syscalls through.
jals-config.workspace = true
jals-exec.workspace = true
jals-progress.workspace = true
jals-storage.workspace = true
rhai = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1.0", optional = true, default-features = false, features = [
  "alloc",
] }
tinywasm = { workspace = true, optional = true }
toml.workspace = true

[dev-dependencies]
jals-exec = { workspace = true, features = ["tokio"] }
tempfile = "3"

[lints]
workspace = true
