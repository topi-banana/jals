[package]
name = "jals-fmt"
version.workspace = true
edition.workspace = true

[dependencies]
jals-config.workspace = true
jals-syntax.workspace = true
# Cooperative yielding only (`yield_now` / `Yielder`): the formatter is pure CPU work on a `!Send`
# future and never names a runtime, so the portable `no_std` core is all it needs.
jals-exec.workspace = true
# `TextRange` / `TextSize`, the units `jals-syntax` reports token positions in.
text-size.workspace = true
# The importer models derive `Deserialize`; the KV → struct bridge routes through
# `serde_json::Value` (both `no_std + alloc`, so the default build stays wasm-safe).
serde.workspace = true
serde_json.workspace = true
# Host-only XML reader for the Eclipse profile / IntelliJ scheme importers. Gated behind `std`
# so the default (portable, wasm) build never pulls it. The `.prefs` (Java properties) and
# `.editorconfig` readers are pure `&str` parsers and need no dependency, so they stay portable.
quick-xml = { workspace = true, optional = true }

[dev-dependencies]
# The Spotless importer models a *resolved* pipeline, so its test constructs one from a
# `[compat.spotless]`-shaped TOML table the way a future config loader would.
toml.workspace = true

[features]
default = []
# Enables the XML-backed config importers (Eclipse exported profile, IntelliJ code-style scheme).
# Host-only; not enabled by the wasm playground.
std = ["dep:quick-xml"]

[lints]
workspace = true
