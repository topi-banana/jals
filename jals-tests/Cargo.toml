[package]
name = "jals-tests"
version.workspace = true
edition.workspace = true
# The crate ships two binaries (jals-tests, jals-golden); keep `cargo run -p
# jals-tests` resolving to the parse-soundness CLI.
default-run = "jals-tests"

[lib]
name = "jals_tests"
path = "src/lib.rs"

[[bin]]
name = "jals-tests"
path = "src/main.rs"

[[bin]]
name = "jals-golden"
path = "src/bin/golden.rs"

[dependencies]
clap.workspace = true
jals-config.workspace = true
jals-exec = { workspace = true, features = ["tokio"] }
# `std` brings in the XML config importers: the Eclipse and IntelliJ golden corpora are
# scored with the very profile/scheme files their generators hand the native tool, and
# IntelliJ's is a code-style XML.
jals-fmt = { workspace = true, features = ["std"] }
jals-syntax.workspace = true
rayon.workspace = true
similar.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile = "3"
# Reads the `jals-fmt.toml` Google preset back, so the file and the importer cannot drift.
toml.workspace = true
