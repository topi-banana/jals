[package]
name = "jals-config"
version.workspace = true
edition.workspace = true

[dependencies]
# The config data models for `jals.toml` / `jalsfmt.toml` / `jalslint.toml`, plus their parsing and
# discovery. Pure/`no_std`: loaders read an immutable `jals-storage` revision, so this crate has no
# direct filesystem access and stays `wasm32`-compatible.
jals-exec.workspace = true
jals-storage.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true

[dev-dependencies]
# The schema tests walk the serialized shape of a config rather than its Rust fields, so a key that
# only exists as a struct member cannot pass them. `toml` cannot render (no `display` feature, by
# workspace policy), so the walk goes through JSON.
serde_json.workspace = true

[lints]
workspace = true
