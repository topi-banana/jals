# jals-lint configuration — the frequently-touched keys, with their built-in values.
#
# Every key is optional; an omitted key, or an omitted whole section, leaves the rule at the level
# shown here. The complete schema is `jals_config::lint`, one module per section, and
# `jals-lint/README.md` is the rule list.
#
# A rule's value is its level ("allow" / "warn" / "error"), or a table of that level and the rule's
# own options. `level` is the reserved key inside the table form, and it may be omitted — a table
# that sets only options keeps the rule's built-in level rather than restating it.
#
# This file levels a rule for the whole tree below it. One declaration opts out in source with
# `@SuppressWarnings`, naming a rule ("unused-variables"), a section ("unused") or "all".

# The code is wrong: it does not resolve, or it contradicts its own types.
[correctness]
cannot-resolve = "error"
type-mismatch = "warn"
unreported-exception = "warn"

# `nullness-mismatch` is the one rule here with options, and it is spelled long because its two
# vocabularies do not fit an inline table. `default` says how a declaration carrying neither
# annotation reads — it is about the *code*, not about this rule's built-in level — and
# "non-null" is the strict reading: an unannotated slot rejects `null`. A codebase that annotates
# only part of itself writes "unspecified" here and keeps the checking to what it did annotate.
# Setting `nullable` or `non-null` replaces the list rather than adding to it.
[correctness.nullness-mismatch]
level = "warn"
default = "non-null"
nullable = [
  "org.jspecify.annotations.Nullable",
  "javax.annotation.Nullable",
  "javax.annotation.CheckForNull",
  "jakarta.annotation.Nullable",
  "org.jetbrains.annotations.Nullable",
  "androidx.annotation.Nullable",
  "org.checkerframework.checker.nullness.qual.Nullable",
  "org.eclipse.jdt.annotation.Nullable",
  "edu.umd.cs.findbugs.annotations.Nullable",
  "org.springframework.lang.Nullable",
]
non-null = [
  "org.jspecify.annotations.NonNull",
  "javax.annotation.Nonnull",
  "jakarta.annotation.Nonnull",
  "org.jetbrains.annotations.NotNull",
  "androidx.annotation.NonNull",
  "org.checkerframework.checker.nullness.qual.NonNull",
  "org.eclipse.jdt.annotation.NonNull",
  "edu.umd.cs.findbugs.annotations.NonNull",
  "org.springframework.lang.NonNull",
  "lombok.NonNull",
]

# The code is legal here and not everywhere it has to run. Every rule is gated on the project's
# `[package] features`, so a plain Java project only ever sees the jals dialect rules.
[compatibility]
compact-source-file = "error"
module-import = "error"
grouped-import = "error"
attribute = "error"

# The code compiles and is probably not what was meant.
[suspicious]
constant-condition = "warn"
empty-catch = { level = "warn", commented = "accept", allowed-names = [] }

# Something is declared and nothing reads it.
[unused]
unused-variables = { level = "warn", ignore-prefix = "_" }
unused-imports = "warn"
dead-code = { level = "warn", annotated = "skip" }

# The same meaning is available in a simpler form.
[complexity]
collapsible-if = "warn"

# The same meaning is available in a cheaper form.
[performance]
boxed-primitive-constructor = "warn"

# Correct code written unconventionally.
[style]
wildcard-import = { level = "warn", static-imports = "report" }
missing-braces = { level = "warn", policy = "always" }

# One rule, one key per kind of declaration. Set a kind to "any" to stop checking it.
[naming.naming-convention]
types = "upper-camel-case"
methods = "lower-camel-case"
fields = "lower-camel-case"
constants = "screaming-snake-case"
statics = "screaming-snake-case"
parameters = "lower-camel-case"
locals = "lower-camel-case"

# Javadoc that is absent, empty, or out of step with its declaration.
[documentation]
empty-javadoc = "warn"

# Correct, idiomatic, fast code a project has chosen to ban anyway. Each rule here carries its
# own built-in level rather than the section deciding one for all of them.
[restriction]
print-to-console = { level = "allow", streams = "both" }
implicit-this = { level = "warn", scope = "always" }
